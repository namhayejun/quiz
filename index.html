
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>과테말라 상식 퀴즈</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Malgun Gothic",sans-serif;
background:#edf5ff;color:#172b49}
.app{min-height:100vh;padding:30px 16px}
main{max-width:850px;margin:auto}
header{text-align:center;padding:25px 0}
.flag{display:flex;width:90px;height:12px;margin:0 auto 20px}
.flag span{flex:1;background:#70c7ed}
.flag span:nth-child(2){background:white}
h1{font-size:clamp(30px,5vw,46px);margin:0}
.sub{color:#61748d;line-height:1.8}
.card{background:white;border-radius:24px;padding:clamp(22px,5vw,44px);
box-shadow:0 12px 40px #193b6315}
.top{display:flex;justify-content:space-between;gap:10px}
.muted{color:#718096}
.track{height:8px;background:#e5edf8;border-radius:20px;margin:20px 0}
.fill{height:100%;width:0;background:#2375e1;border-radius:20px}
.tag{color:#1764ce;font-weight:bold;margin-top:28px}
h2{font-size:clamp(23px,4vw,32px);line-height:1.5}
.hint{color:#718096;font-size:14px;line-height:1.7}
input{width:100%;padding:17px;border:2px solid #d8e3f1;
border-radius:14px;font-size:18px;margin-top:12px;outline:none}
input:focus{border-color:#2375e1}
.buttons{display:flex;gap:12px;margin-top:24px}
button{border:0;border-radius:13px;padding:16px;
font-size:16px;font-weight:bold;cursor:pointer}
.primary{background:#1764ce;color:white;flex:1}
.secondary{background:#eaf1fb;color:#24415f}
button:disabled{opacity:.5}
.feedback{margin-top:20px;font-weight:bold;line-height:1.7}
.good{color:#16804b}.bad{color:#c23845}
.result{text-align:center;display:none}
.big{font-size:48px;font-weight:900;color:#1764ce;margin:24px}
@media(max-width:480px){
.app{padding:12px}.card{border-radius:18px}
.buttons{flex-direction:column-reverse}
}
</style>
</head>
<body>
<div class="app">
<main>
<header>
<div class="flag"><span></span><span></span><span></span></div>
<h1>과테말라 상식 퀴즈</h1>
<p class="sub">10개 문제 중 하나를 무작위로 추첨해요.<br>
답을 직접 입력하고 실력을 확인해 보세요!</p>
</header>

<section class="card">
<div id="quiz">
<div class="top">
<strong>🎯 무작위 추첨 문제</strong>
<strong class="muted" id="number"></strong>
</div>
<div class="track"><div class="fill" id="fill"></div></div>
<div class="tag">주관식 문제</div>
<h2 id="question"></h2>
<p class="hint" id="hint">정답을 직접 입력하세요.</p>
<input id="answer" placeholder="여기에 답 입력" autocomplete="off">
<div class="feedback" id="feedback" aria-live="polite"></div>
<div class="buttons">
<button class="secondary" id="again">다시 추첨</button>
<button class="primary" id="check">정답 확인</button>
</div>
</div>

<div class="result" id="result">
<h2 id="resultTitle">추첨 결과</h2>
<div class="big" id="resultScore"></div>
<p id="resultText"></p>
<button class="primary" id="retry">다시 추첨하기 🎲</button>
</div>
</section>
</main>
</div>

<script>
const questions=[
{
q:"과테말라의 인구는 약 몇 명일까요?",
hint:"예: 1700만명",
answers:["약1700만명","1700만명","1천700만명","약1천700만명","17000000"]
},
{
q:"과테말라에서 '안녕하세요'는 무엇일까요?",
hint:"스페인어 인사말을 입력하세요.",
answers:["hola","올라"]
},
{
q:"자이언트 연 축제는 보통 몇 월에 열릴까요?",
hint:"월을 숫자로 입력하세요. 예: 11",
answers:["11","11월","11월달"]
},
{
q:"Canicas는 어떤 놀이일까요?",
hint:"놀이 이름을 입력하세요.",
answers:["구슬치기","구슬","구슬놀이"]
},
{
q:"과테말라의 유명한 호수는 무엇일까요?",
hint:"호수 이름을 입력하세요.",
answers:["아티틀란호수","아티틀란","atitlan","lakeatitlan"]
},
{
q:"자료에 나온 과테말라 음식 3가지는 무엇일까요?",
hint:"따말, 페피안, 까끼익을 모두 입력하세요. 순서는 상관없어요.",
answers:["따말페피안까끼익","따말까끼익페피안",
"페피안따말까끼익","페피안까끼익따말",
"까끼익따말페피안","까끼익페피안따말"]
},
{
q:"과테말라의 면적은 약 얼마일까요?",
hint:"제곱킬로미터 숫자를 입력하세요. 예: 108,889",
answers:["108889","108,889"]
},
{
q:"과테말라의 수도는 어디일까요?",
hint:"도시 이름을 입력하세요.",
answers:["과테말라시티","guatemalacity","과테말라시","과테말라시티시"]
},
{
q:"과테말라의 대표 종교는 무엇일까요?",
hint:"종교 이름을 입력하세요.",
answers:["기독교","가톨릭과개신교","가톨릭개신교",
"기독교가톨릭개신교","가톨릭","개신교"]
},
{
q:"과테말라의 화폐는 무엇일까요?",
hint:"화폐 이름을 입력하세요.",
answers:["케찰","quetzal","quetzales"]
}
];

let current=null;
let finished=false;

const $=id=>document.getElementById(id);
function normalize(s){
return s.toLowerCase().replace(/[\s,，.·\-_'’()]/g,"");
}

function draw(){
current=Math.floor(Math.random()*questions.length);
finished=false;
$("quiz").style.display="block";
$("result").style.display="none";
$("number").textContent="총 10개 중 추첨";
$("fill").style.width="10%";
$("question").textContent=questions[current].q;
$("hint").textContent=questions[current].hint;
$("answer").value="";
$("answer").disabled=false;
$("feedback").textContent="";
$("feedback").className="feedback";
$("check").disabled=false;
$("answer").focus();
}

function checkAnswer(){
if(finished)return;
const value=normalize($("answer").value);
if(!value){
$("feedback").textContent="먼저 답을 입력해 주세요.";
$("feedback").className="feedback bad";
return;
}

finished=true;
const q=questions[current];
const correct=q.answers.some(a=>normalize(a)===value);

$("answer").disabled=true;
$("check").disabled=true;
$("fill").style.width="100%";
$("feedback").textContent=correct
?"정답이에요! 🎉 잘했어요!"
:"아쉬워요! 다음에 다시 도전해 보세요.";
$("feedback").className="feedback "+(correct?"good":"bad");

setTimeout(()=>{
$("quiz").style.display="none";
$("result").style.display="block";
$("resultTitle").textContent=correct?"정답입니다! 🎉":"이번에는 아쉽네요!";
$("resultScore").textContent=correct?"정답":"다시 도전!";
$("resultText").textContent="정답은 공개하지 않아요. 새 문제를 추첨해 보세요!";
},900);
}

$("check").addEventListener("click",checkAnswer);
$("answer").addEventListener("keydown",e=>{
if(e.key==="Enter")checkAnswer();
});
$("again").addEventListener("click",draw);
$("retry").addEventListener("click",draw);
draw();
</script>
</body>
</html>
