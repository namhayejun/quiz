
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>과테말라 상식 퀴즈</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Malgun Gothic",sans-serif;background:linear-gradient(135deg,#d9f1ff,#e8e4ff);color:#202b45}
main{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{background:white;width:100%;max-width:1000px;padding:clamp(24px,5vw,60px);border-radius:28px;box-shadow:0 15px 50px #26365a22}
.flag{text-align:center;font-size:52px}
h1{text-align:center;font-size:clamp(30px,5vw,46px);margin:12px 0}
.sub{text-align:center;color:#65718b;margin-bottom:38px}
.tag{font-weight:bold;color:#5868d9}
#question{font-size:clamp(24px,4vw,36px);font-weight:bold;line-height:1.6;margin:18px 0 30px;word-break:keep-all}
input{width:100%;padding:19px;font-size:20px;border:2px solid #dce2f0;border-radius:14px;outline:none}
input:focus{border-color:#5868e8}
.hint{font-size:14px;color:#77819a;margin-top:10px}
.buttons{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
button{flex:1;min-width:150px;padding:17px;border:0;border-radius:13px;font-size:17px;font-weight:bold;cursor:pointer}
#check{background:#5868e8;color:white}
#next{background:#e9edff;color:#4052b9}
button:disabled{opacity:.5;cursor:not-allowed}
#result{display:none;margin-top:24px;padding:22px;border-radius:15px;font-size:18px;line-height:1.7;overflow-wrap:anywhere}
#result.show{display:block}
#result.good{background:#e5f8eb;color:#176c3b}
#result.bad{background:#fff0e7;color:#93451f}
#correctAnswer{font-weight:bold;font-size:21px;margin-top:8px}
footer{text-align:center;color:#8991a6;font-size:13px;margin-top:25px}
@media(max-width:500px){main{padding:12px}.card{border-radius:20px}.buttons button{min-width:100%}}
</style>
</head>
<body>
<main>
<section class="card">
  <div class="flag">🇬🇹</div>
  <h1>과테말라 상식 퀴즈</h1>
  <p class="sub">과테말라에 대해 얼마나 알고 있을까?</p>

  <div class="tag">🎲 무작위 주관식 퀴즈</div>
  <div id="question"></div>

  <form id="form">
    <label for="answer" class="tag">정답 입력</label>
    <input id="answer" type="text" placeholder="여기에 답을 입력하세요" required>
    <div id="hint" class="hint"></div>
    <div class="buttons">
      <button id="check" type="submit">정답 확인</button>
      <button id="next" type="button">다른 문제 뽑기 ↻</button>
    </div>
  </form>

  <div id="result" aria-live="polite">
    <div id="feedback"></div>
    <div id="correctAnswer"></div>
  </div>
  <footer>GUATEMALA QUIZ</footer>
</section>
</main>

<script>
const questions = [
  {
    q:"과테말라의 인구는 대략 몇 명일까요?",
    a:["약 1,700만 명","약 1700만명","1700만명","1천700만명","1700만"],
    hint:"약 1,700만 명처럼 입력하세요."
  },
  {
    q:"과테말라에서 '안녕하세요'는 무엇일까요?",
    a:["Hola","올라"],
    hint:"스페인어 인사말을 입력하세요."
  },
  {
    q:"거대한 연 축제는 보통 몇 월에 열릴까요?",
    a:["11월","11","November"],
    hint:"월이나 숫자로 입력하세요."
  },
  {
    q:"Canicas는 어떤 놀이일까요?",
    a:["구슬치기","구슬 치기","구슬놀이","구슬 놀이","구슬"],
    hint:"놀이의 이름을 입력하세요."
  },
  {
    q:"과테말라의 유명한 호수 이름은 무엇일까요?",
    a:["아티틀란 호수","아티틀란호수","아티틀란","Lake Atitlan","Atitlan","아티틀란호"],
    hint:"호수 이름을 입력하세요."
  },
  {
    q:"자료에 나온 과테말라 음식 세 가지는 무엇일까요?",
    a:[],
    foods:[["따말","타말"],["페피안"],["까끼익","카끼익"]],
    hint:"따말, 페피안, 까끼익 세 가지를 모두 입력하세요."
  },
  {
    q:"과테말라의 면적은 몇 km²일까요?",
    a:["108889","108,889"],
    hint:"108,889처럼 천 단위 쉼표를 넣어도 돼요."
  },
  {
    q:"과테말라의 수도는 어디일까요?",
    a:["과테말라시티","과테말라 시티","Guatemala City","GuatemalaCity"],
    hint:"수도 이름을 입력하세요."
  },
  {
    q:"과테말라의 주요 종교는 무엇일까요?",
    a:["기독교","그리스도교","Christianity","가톨릭과 개신교","가톨릭 및 개신교"],
    hint:"주요 종교를 입력하세요."
  },
  {
    q:"과테말라에서 사용하는 화폐의 이름은 무엇일까요?",
    a:["케찰","퀘찰","Quetzal","Quetzales"],
    hint:"화폐 이름을 입력하세요."
  }
];

const $ = id => document.getElementById(id);
let current;
let previous = -1;
let answered = false;

function normalize(s){
  return s.toLowerCase()
    .normalize("NFKC")
    .replace(/[\s,，.。!?·'"’‘“”()[\]{}]/g,"");
}

function distance(a,b){
  const row = Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    let prev=row[0];
    row[0]=i;
    for(let j=1;j<=b.length;j++){
      const old=row[j];
      row[j]=Math.min(
        row[j]+1,
        row[j-1]+1,
        prev+(a[i-1]===b[j-1]?0:1)
      );
      prev=old;
    }
  }
  return row[b.length];
}

function matches(input, aliases){
  const value=normalize(input);
  return aliases.some(alias=>{
    const target=normalize(alias);
    if(value===target)return true;
    const limit=target.length>=8?2:target.length>=4?1:0;
    return limit>0 &&
      Math.abs(value.length-target.length)<=limit &&
      distance(value,target)<=limit;
  });
}

function checkAnswer(input){
  if(current.foods){
    const parts=input.split(/[,，、/]+/).map(normalize).filter(Boolean);
    if(parts.length<3)return false;
    return current.foods.every(group=>
      parts.some(part=>matches(part,group))
    );
  }
  if(current.q.includes("면적")){
    return input.replace(/[,\s]/g,"")==="108889";
  }
  return matches(input,current.a);
}

function getAnswer(item){
  if(item.foods)return "따말, 페피안, 까끼익";
  if(item.q.includes("인구"))return "약 1,700만 명";
  if(item.q.includes("안녕하세요"))return "Hola (올라)";
  if(item.q.includes("축제"))return "11월";
  if(item.q.includes("Canicas"))return "구슬치기";
  if(item.q.includes("호수"))return "아티틀란 호수";
  if(item.q.includes("면적"))return "108,889 km²";
  if(item.q.includes("수도"))return "과테말라시티";
  if(item.q.includes("종교"))return "기독교 (가톨릭과 개신교)";
  if(item.q.includes("화폐"))return "케찰 (Quetzal)";
  return item.a[0];
}

function draw(){
  let index;
  do{
    index=Math.floor(Math.random()*questions.length);
  }while(questions.length>1&&index===previous);
  previous=index;
  current=questions[index];
  answered=false;
  $("question").textContent=current.q;
  $("hint").textContent=current.hint;
  $("answer").value="";
  $("answer").disabled=false;
  $("check").disabled=false;
  $("result").className="";
  $("feedback").textContent="";
  $("correctAnswer").textContent="";
  $("answer").focus();
}

$("form").addEventListener("submit",event=>{
  event.preventDefault();
  if(answered)return;
  const input=$("answer").value.trim();
  if(!input){
    $("answer").focus();
    return;
  }
  answered=true;
  const correct=checkAnswer(input);
  $("result").className="show "+(correct?"good":"bad");
  $("feedback").textContent=correct
    ?"🎉 정답입니다!"
    :"아쉽지만 오답이에요!";
  $("correctAnswer").textContent="정답: "+getAnswer(current);
  $("answer").disabled=true;
  $("check").disabled=true;
});

$("next").addEventListener("click",draw);
draw();
</script>
</body>
</html>
