
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>과테말라 상식 퀴즈</title>
<style>
body{font-family:Arial,sans-serif;background:#eef5ff;color:#17304f;margin:0;padding:24px}
main{max-width:650px;margin:auto;background:white;padding:24px;border-radius:20px;box-shadow:0 8px 25px #ccd8e8}
h1{text-align:center}
.hint{color:#64748b}
input{width:95%;padding:14px;border:1px solid #b9c9df;border-radius:10px;font-size:17px}
button{padding:12px 18px;border:0;border-radius:10px;cursor:pointer;font-size:16px;margin:8px 4px 0 0}
.primary{background:#1764d2;color:white}
#feedback{padding:12px;margin-top:12px;border-radius:10px}
#result{white-space:pre-line}
</style>
</head>
<body>
<main>
<h1>🇬🇹 과테말라 상식 퀴즈</h1>
<p id="progress">문제 1 / 10</p>
<h2 id="question"></h2>
<p class="hint" id="hint"></p>
<input id="answer" placeholder="정답을 입력하세요" autocomplete="off">
<div>
<button class="primary" id="check">정답 확인</button>
<button class="primary" id="next" hidden>다음 문제 →</button>
<button id="restart">처음부터</button>
</div>
<p id="feedback"></p>
<section id="result" hidden></section>
</main>
<script>
const questions=[
{q:"과테말라의 인구는 약 몇 명일까요?",h:"약 1,700만 명",a:["1700만명","약1700만명","1천700만명"]},
{q:"과테말라에서 '안녕하세요'는 무엇일까요?",h:"스페인어 인사말",a:["hola","올라"]},
{q:"자이언트 연 축제는 보통 몇 월에 열릴까요?",h:"숫자 또는 월로 입력",a:["11월","11"]},
{q:"Canicas는 어떤 놀이일까요?",h:"작고 둥근 장난감",a:["구슬치기","구슬"]},
{q:"과테말라의 유명한 호수는 무엇일까요?",h:"아티틀란 호수",a:["아티틀란호수","아티틀란","atitlan"]},
{q:"자료에 나온 과테말라 음식 3가지는?",h:"쉼표로 구분해 입력: 따말, 페피안, 까끼익",a:["따말페피안까끼익","135","tamalpepiankaqik"]},
{q:"과테말라의 면적은 약 얼마일까요?",h:"천 단위로 입력해도 돼요. 예: 108,889",a:["108889"]},
{q:"과테말라의 수도는 어디일까요?",h:"나라 이름과 비슷해요",a:["과테말라시티","guatemalacity"]},
{q:"과테말라의 대표 종교는 무엇일까요?",h:"가톨릭과 개신교를 포함해요",a:["기독교","가톨릭과개신교","가톨릭개신교"]},
{q:"과테말라의 화폐는 무엇일까요?",h:"케찰",a:["케찰","quetzal"]}
];
let index=0,score=0,locked=false,answers=[];
const $=id=>document.getElementById(id);
function normalize(s){return s.toLowerCase().replace(/[\s,，、.·²]/g,"").replace(/km/g,"")}
function distance(a,b){
 let row=Array.from({length:b.length+1},(_,i)=>i);
 for(let i=1;i<=a.length;i++){
  let prev=row[0];row[0]=i;
  for(let j=1;j<=b.length;j++){
   let old=row[j];
   row[j]=Math.min(row[j]+1,row[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));
   prev=old;
  }
 }
 return row[b.length];
}
function render(){
 locked=false;
 $("progress").textContent=`문제 ${index+1} / ${questions.length}`;
 $("question").textContent=questions[index].q;
 $("hint").textContent=questions[index].h;
 $("answer").value="";
 $("answer").disabled=false;
 $("check").hidden=false;
 $("check").disabled=false;
 $("next").hidden=true;
 $("feedback").textContent="";
 $("result").hidden=true;
 $("answer").focus();
}
function check(){
 if(locked||!$("answer").value.trim())return;
 locked=true;
 let entered=normalize($("answer").value);
 let correct=questions[index].a.some(raw=>{
  let expected=normalize(raw);
  return entered===expected||
   (entered.length>=3&&expected.length>=3&&distance(entered,expected)<=2);
 });
 if(index===5){
  correct=["따말페피안까끼익","135","tamalpepiankaqik"].includes(entered);
 }
 if(correct)score++;
 answers[index]=correct;
 $("feedback").textContent=correct?"정답이에요! 🎉":"아쉬워요! 정답: "+questions[index].h;
 $("answer").disabled=true;
 $("check").hidden=true;
 $("next").hidden=false;
 $("next").textContent=index===questions.length-1?"결과 보기 →":"다음 문제 →";
}
function finish(){
 $("progress").textContent="퀴즈 완료!";
 $("question").textContent="최종 점수: "+score+" / "+questions.length;
 $("hint").textContent="";
 $("answer").hidden=true;
 $("check").hidden=true;
 $("next").hidden=true;
 $("feedback").textContent="";
 $("result").hidden=false;
 $("result").textContent=questions.map((q,i)=>
  `${i+1}. ${q.q}\n정답: ${q.h} ${answers[i]?"✅":"📘"}`
 ).join("\n\n");
}
$("check").onclick=check;
$("answer").addEventListener("keydown",e=>{if(e.key==="Enter")check()});
$("next").onclick=()=>{
 if(index<questions.length-1){index++;render()}
 else finish();
};
$("restart").onclick=()=>{
 index=0;score=0;answers=[];
 $("answer").hidden=false;render();
};
render();
</script>
</body>
</html>
